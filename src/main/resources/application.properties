
# ===========================================
# QUESTCONNECT API CONFIGURATION
# ===========================================

# Application Name
spring.application.name=Questconnect

# ===========================================
# SERVER CONFIGURATION
# ===========================================
# Port pour QuestConnect (Gateway/Security)
server.port=8080
# Contexte de l'application - toutes les routes seront pr�fix�es
server.servlet.context-path=/questconnect

# ===========================================
# BACKEND API CONFIGURATION
# ===========================================
# URL de votre API m�tier witchertoolkit-back
toolkit.api.base.url=http://localhost:8081/witcher-toolkit

# ===========================================
# JWT CONFIGURATION
# ===========================================
# Cl� secr�te pour signer les tokens JWT (minimum 256 bits pour HS256)
jwt.secret=ChangeThisSecretToAStrongRandomStringForProduction1234567890123456789012345678901234567890
# Dur�e de vie du token en millisecondes (24h = 86400000ms)
jwt.expiration=86400000
# Header HTTP pour le token
jwt.header=Authorization
# Pr�fixe du token dans le header
jwt.prefix=Bearer 

# ===========================================
# CORS CONFIGURATION
# ===========================================
# Origins autoris�es (votre front Angular)
cors.allowed.origins=http://localhost:4200
# M�thodes HTTP autoris�es
cors.allowed.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
# Headers autoris�s (* pour simplicit�, ou sp�cifiez : Content-Type,Authorization,X-Requested-With)
cors.allowed.headers=*
# Permettre l'envoi de cookies/credentials
cors.allow.credentials=true
# Temps de cache pour les requ�tes preflight OPTIONS
cors.max.age=3600

# ===========================================
# LOGGING CONFIGURATION
# ===========================================
logging.level.root=INFO
logging.level.fr.meya.witcher=DEBUG
# Logs d�taill�s pour le JWT (temporaire pour debug)
logging.level.org.springframework.security=DEBUG

# ===========================================
# SPRING BOOT ACTUATOR (Monitoring)
# ===========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always